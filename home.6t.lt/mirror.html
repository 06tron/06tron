/**
 * Swaps characters in the string 'str' according to the
 * mapping string 'm'. The mapping contains exactly the
 * characters to be swapped, ordered such that all
 * occurrences in 'str' of the i-th character in 'm' are
 * swapped for the i-th character in the reversal of
 * 'm'. So the last and first characters of 'm' are
 * paired, as are the second and second-to-last. Note
 * that replace() is used twice because the four
 * characters of "\^]-" sometimes need to be escaped
 * before inclusion in a JavaScript regular expression
 * character class.
 */
function charSwap(str, m) {
	return str?.replace(new RegExp(`[${m.replace(/[\\^\]-]/g, "\\$&")}]`, "g"), char => m.charAt(m.length - m.indexOf(char) - 1));
}

DOMPurify.addHook("uponSanitizeAttribute", function (node, data) {
	if (node.tagName === "A") {
		const valStart = data.attrValue.trimStart().slice(0, 15);
		if (valStart.startsWith("data:") && valStart !== "data:text/vcard") {
			data.keepAttr = false;
		}
	}
});

const query = new URLSearchParams(window.location.search);
const input = query.get("b")
	?? charSwap(query.get("h"), query.get("m") ?? `&"><'%X\tZ\n$~()*@`)
	?? document.querySelector('meta[name="description"]').content + ` You might also be looking for this website's <a href="https://home.6t.lt">homepage</a>.`;
addEventListener("DOMContentLoaded", function() {
	document.body.innerHTML = DOMPurify.sanitize(input, { ADD_DATA_URI_TAGS: ["a"] });
});
</script>
